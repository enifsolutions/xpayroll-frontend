name: Deploy Frontend

on:
  push:
    branches:
      - main
      - feature/transactions
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to VPS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/enifsolutions/xpayroll-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_BASE=${{ secrets.NEXT_PUBLIC_API_BASE }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: 22
          script: |
            set -e
            cd /opt/xpayroll/app

            echo "=== Logging in to GHCR ==="
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ secrets.GHCR_USER }} --password-stdin

            echo "=== Pulling latest frontend image ==="
            docker compose -f docker-compose.prod.yml pull frontend

            echo "=== Recreating frontend container ==="
            docker compose -f docker-compose.prod.yml up -d --no-deps --force-recreate frontend

            echo "=== Container status ==="
            sleep 8
            docker compose -f docker-compose.prod.yml ps frontend

            echo "=== Pruning old images ==="
            docker image prune -f

            echo "=== Frontend deployment complete ==="
